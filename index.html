<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03070d" />
    <title>Corvette C8 | Lumen Run</title>
  </head>
  <body>
    <div class="loader" aria-live="polite">Loading the C8</div>
    <main class="experience">
      <canvas class="modern-webgl" aria-label="Animated Corvette C8 visualisation"></canvas>
      <header class="topbar">
        <a class="wordmark" href="/variation/" aria-label="View the original Corvette experiment">C8<span>/</span>STINGRAY</a>
        <p>Mid-engine. All focus.</p>
      </header>
      <section class="hero-copy" aria-labelledby="hero-title">
        <p class="kicker">A study in forward motion</p>
        <h1 id="hero-title">Own the<br />afterglow.</h1>
        <p class="intro">A Corvette C8 cutting through an endless light field.</p>
        <button class="text-cta" type="button" data-next-color>Change the mood <span aria-hidden="true">⟳</span></button>
      </section>
      <section class="drive-control" aria-label="Choose driving pace">
        <p>Drive pace</p>
        <div class="speed-buttons" role="group" aria-label="Driving pace options">
          <button class="speed-button" type="button" data-speed="slow" aria-pressed="false">Slow</button>
          <button class="speed-button is-active" type="button" data-speed="default" aria-pressed="true">Default</button>
          <button class="speed-button" type="button" data-speed="fast" aria-pressed="false">Very fast</button>
        </div>
      </section>
      <section class="paint-control" aria-label="Choose body colour">
        <p>Exterior finish</p>
        <div class="paint-swatches" role="group" aria-label="Exterior colour options">
          <button class="paint-swatch is-active" type="button" data-color="#b6212d" aria-label="Select velocity red"></button>
          <button class="paint-swatch" type="button" data-color="#f0f1ec" aria-label="Select ceramic white"></button>
          <button class="paint-swatch" type="button" data-color="#2648b8" aria-label="Select deep blue"></button>
          <button class="paint-swatch" type="button" data-color="#5d6874" aria-label="Select graphite"></button>
          <button class="paint-swatch" type="button" data-color="#c9863a" aria-label="Select solar orange"></button>
          <button class="paint-swatch" type="button" data-color="#257c66" aria-label="Select deep emerald"></button>
          <button class="paint-swatch" type="button" data-color="#703aa9" aria-label="Select ultraviolet"></button>
        </div>
      </section>
      <a class="model-credit" href="https://sketchfab.com/3d-models/2019-chevrolet-corvette-c8-stingray-790c40ccff6843eab0b7b4bd18421ff8">C8 model by Sketchfab</a>
    </main>
    <script type="module" src="/src/variation.js"></script>
  </body>
</html>
